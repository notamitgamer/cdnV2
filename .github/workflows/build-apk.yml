name: Build & Release Android APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'App version name (e.g. 1.0.0)'
        required: false
        default: '1.0.0'
  push:
    tags:
      - 'apk-v*'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Pre-configure Bubblewrap (skip interactive JDK/SDK prompts)
        run: |
          mkdir -p "$HOME/.bubblewrap"
          # bubblewrap's SDK path check only recognizes the legacy layout
          # (a `tools` or `bin` folder directly under the SDK root). The
          # cmdline-tools package installed by android-actions/setup-android
          # puts those under cmdline-tools/latest/ instead, so add an empty
          # `tools` dir purely to satisfy that existence check.
          mkdir -p "$ANDROID_HOME/tools"
          python3 - << PYEOF
          import json
          config = {"jdkPath": "$JAVA_HOME", "androidSdkPath": "$ANDROID_HOME"}
          with open("$HOME/.bubblewrap/config.json", "w") as f:
              json.dump(config, f, indent=2)
          PYEOF
          cat "$HOME/.bubblewrap/config.json"

      - name: Restore signing keystore
        working-directory: android
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android.keystore

      - name: Compute version code
        id: version
        run: |
          NAME="${{ inputs.version_name || '1.0.0' }}"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Set version in twa-manifest.json
        working-directory: android
        run: |
          python3 - << 'PYEOF'
          import json
          with open("twa-manifest.json") as f:
              data = json.load(f)
          data["appVersionCode"] = int("${{ steps.version.outputs.code }}")
          data["appVersionName"] = "${{ steps.version.outputs.name }}"
          with open("twa-manifest.json", "w") as f:
              json.dump(data, f, indent=2)
          PYEOF

      - name: Generate the Android Gradle project from twa-manifest.json
        working-directory: android
        run: |
          set -o pipefail
          # This repo only commits twa-manifest.json, not the actual generated
          # Gradle project (no manifest-checksum.txt either). `bubblewrap build`
          # detects that and always stops to ask "regenerate your project?" -
          # a prompt with no TTY to answer it in CI. Running `update` explicitly
          # here generates the project and writes manifest-checksum.txt, so the
          # later `build` step sees a matching checksum and skips straight to
          # compiling instead of prompting.
          # --skipVersionUpgrade: we already set the version above; this also
          # avoids a further prompt asking for a version name.
          bubblewrap update --skipVersionUpgrade 2>&1 | tee update.log
          exit_code=${PIPESTATUS[0]}
          if [ "$exit_code" -ne 0 ]; then
            echo "## Bubblewrap update failed - last 100 lines" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -100 update.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit "$exit_code"
          fi

      - name: Build signed APK
        working-directory: android
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -o pipefail
          # ~/.bubblewrap/config.json (written in the "Pre-configure Bubblewrap"
          # step) already has valid jdkPath/androidSdkPath, and the project was
          # already generated with a matching manifest-checksum.txt in the
          # previous step, so bubblewrap won't prompt interactively here.
          bubblewrap build --skipPwaValidation 2>&1 | tee build.log
          exit_code=${PIPESTATUS[0]}
          if [ "$exit_code" -ne 0 ]; then
            echo "## Bubblewrap build failed - last 100 lines" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -100 build.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit "$exit_code"
          fi

      - name: Verify APK
        working-directory: android
        run: |
          if [ ! -f app-release-signed.apk ]; then
            echo "ERROR: app-release-signed.apk was not created."
            echo "Files in android directory:"
            ls -lah
            exit 1
          fi
          ls -lh app-release-signed.apk

      - name: Rename artifact
        working-directory: android
        run: |
          cp app-release-signed.apk \
            "amit-cdn-v${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}.apk"

      - name: Clean up keystore
        if: always()
        working-directory: android
        run: |
          rm -f android.keystore

      - name: Upload release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}
          name: amit/cdn Android app v${{ steps.version.outputs.name }} (${{ steps.version.outputs.code }})
          body: |
            Android app build (Trusted Web Activity wrapping cdn.amit.is-a.dev).
            Install: download the APK below, enable "install from unknown sources" for your browser/file manager if prompted, then open it.
            This is not distributed via the Play Store, so updates won't auto-install - grab the latest release here when a new one ships.
          files: android/amit-cdn-v${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}.apk
          make_latest: true
