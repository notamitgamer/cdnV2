name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Lint and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt ruff

      - name: Lint (syntax errors and undefined names)
        run: ruff check --select E9,F63,F7,F82 app

      - name: Byte-compile
        run: python -m compileall -q app

      - name: Smoke test (app imports, static pages render)
        env:
          HF_BUCKET_ID: ci/placeholder
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          import app.main as m

          async def no_stats():  # keep CI independent of the Hugging Face API
              return None

          m.repo_stats = no_stats
          c = TestClient(m.app)
          for path in ["/new", "/static/manifest.json"]:
              r = c.get(path)
              assert r.status_code == 200, (path, r.status_code)
              print(path, r.status_code)
          PY

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t cdnv2 .
